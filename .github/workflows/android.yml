name: Build Android APK

# Every push to main and every pull request: test, build and sign the APK,
# then attach it to the run as a downloadable artifact.
# Pushing a tag like v0.2.0 also publishes a GitHub Release with the APK.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "stable"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and Android templates
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-android-v1

      - name: Download Godot and Android templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p ~/godot "$TPL"
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
          unzip -q -j /tmp/templates.tpz "templates/android_debug.apk" "templates/android_release.apk" "templates/version.txt" -d "$TPL"
          rm -f /tmp/templates.tpz /tmp/godot.zip

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Test (boot + 3-hour playtest bot)
        run: |
          set -o pipefail
          timeout 120 ~/godot/godot --headless --path . --quit-after 300 2>&1 | tee boot.log
          timeout 900 ~/godot/godot --headless --path . res://tests/sim.tscn -- --hours=3 2>&1 | tee sim.log
          if grep -q "SCRIPT ERROR" boot.log sim.log; then
            echo "::error::Script errors found during tests"
            exit 1
          fi

      - name: Point Godot at the Android SDK
        run: |
          set -euo pipefail
          F=$(ls ~/.config/godot/editor_settings-4*.tres | head -1)
          sed -i "s|^export/android/android_sdk_path = .*|export/android/android_sdk_path = \"${ANDROID_SDK_ROOT}\"|" "$F"
          sed -i "s|^export/android/java_sdk_path = .*|export/android/java_sdk_path = \"${JAVA_HOME}\"|" "$F"
          grep "export/android/android_sdk_path\|export/android/java_sdk_path" "$F"

      - name: Stamp version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="0.1.${GITHUB_RUN_NUMBER}"
          fi
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/; s/^version\/name=.*/version\/name=\"${NAME}\"/" export_presets.cfg
          echo "APP_VERSION=${NAME}" >> "$GITHUB_ENV"
          echo "Version ${NAME} (code ${GITHUB_RUN_NUMBER})"

      - name: Export unsigned APK
        run: |
          set -euo pipefail
          mkdir -p build
          ~/godot/godot --headless --path . --export-release "Android" build/unsigned.apk
          test -s build/unsigned.apk

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BT=$(ls -d "${ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)
          if [ -n "${KEYSTORE_B64}" ]; then
            echo "${KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
            KS="${RUNNER_TEMP}/release.jks"
            export SIGN_PASS="${KEYSTORE_PASSWORD}"
            ALIAS="${KEY_ALIAS}"
            OUT="build/CubeGuyIdle-${APP_VERSION}.apk"
          else
            echo "::warning::Signing secrets aren't set, so this APK is signed with a throwaway key. It installs fine, but can't update a copy signed with your real key."
            KS="${RUNNER_TEMP}/throwaway.jks"
            export SIGN_PASS="throwaway-$(openssl rand -hex 12)"
            ALIAS="throwaway"
            keytool -genkeypair -keystore "$KS" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$SIGN_PASS" -keypass "$SIGN_PASS" -dname "CN=Cube Guy Idle CI throwaway" 2>/dev/null
            OUT="build/CubeGuyIdle-${APP_VERSION}-unofficial.apk"
          fi
          "$BT/zipalign" -p -f 4 build/unsigned.apk build/aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" --ks-pass env:SIGN_PASS --key-pass env:SIGN_PASS \
            --out "$OUT" build/aligned.apk
          "$BT/apksigner" verify --print-certs "$OUT" | head -3
          rm -f "$KS" build/unsigned.apk build/aligned.apk build/*.idsig
          echo "APK_PATH=${OUT}" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: CubeGuyIdle-${{ env.APP_VERSION }}
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release created on github.com (which also creates the tag) just gets the APK attached.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${APK_PATH}" --clobber
            exit 0
          fi
          # Tags with a dash (v0.2.0-test.1, v0.2.0-beta) are published as pre-releases.
          PRE=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then PRE="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" "${APK_PATH}" \
            --title "Cube Guy Idle ${APP_VERSION}" \
            --generate-notes ${PRE}
